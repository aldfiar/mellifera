schema: lite

# wf: openspec-pin=1.14.0
# Distribution pin: the openspec CLI is invoked through this version
# (npx --yes -p @fission-ai/openspec@<pin> openspec ...), never bare from PATH.
# Single source of the version constant: the framework's scripts/openspec-pin.sh.

# Project context (optional) — shown to AI when creating artifacts.
# Add your tech stack, conventions, style guides, domain knowledge, etc.
# Example:
#   context: |
#     Tech stack: TypeScript, React, Node.js
#     We use conventional commits
#     Domain: e-commerce platform

# Per-operation guidance (optional) — advisory text shown during apply.
operations:
  apply:
    guidance:
      - 'The plan is DERIVED, never hand-written: author proposal.md + tasks.md (the pinned register grammar), then wf pipeline init + wf pipeline register --from — pipeline.yaml under .tmp/<feature>/ is machine state; never edit it.'
      - 'wf owns execution: wf pipeline verify <feature> <task-id> runs the task verify duty once (full stdout live, receipt appended); green AND red both journal — fix the code and re-run, never trust an old receipt.'
      - 'If your observation disagrees with a recorded green, re-derive — the cmd-match rule de-greens a drifted duty; re-authored work takes a new task id, never a hand edit.'

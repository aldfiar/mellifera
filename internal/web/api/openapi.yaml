          type: string
        type: object
      http_status:
        type: integer
    type: object
host: localhost:8080
info:
  contact: {}
  description: 'Mellifera HTTP edge: scan-root (library) management, item browse/detail,
    and admin liveness. Every handler is pure delegation (parse -> one domain call
    -> write).'
  license:
    name: Apache-2.0
  title: Mellifera API
  version: "1.0"
paths:
  /admin/devices:
    get:
      operationId: admin-devices
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.devicesResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.errorBody'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/api.errorBody'
      summary: List every paired device
      tags:
      - admin
  /admin/devices/{id}:
    delete:
      operationId: admin-devices-revoke
      parameters:
      - description: device id
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: revoked
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.errorBody'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.errorBody'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/api.errorBody'
      summary: Revoke a paired device's token
      tags:
      - admin
  /admin/pairings:
    get:
      operationId: admin-pairings
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.pairingsResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.errorBody'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/api.errorBody'
      summary: List pending device pairing requests
      tags:
      - admin
  /admin/pairings/{id}/approve:
    post:
      operationId: admin-pairings-approve
      parameters:
      - description: pairing id
        in: path
        name: id
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.pairingActionResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.errorBody'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/api.errorBody'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.errorBody'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/api.errorBody'
      summary: Approve a pending pairing request
      tags:
      - admin
  /admin/pairings/{id}/deny:
    post:
      operationId: admin-pairings-deny
      parameters:
      - description: pairing id
        in: path
        name: id
        required: true
        type: string
      responses:
        "200":
          description: empty body
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.errorBody'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/api.errorBody'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.errorBody'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/api.errorBody'
      summary: Deny a pending pairing request
      tags:
      - admin
  /admin/plugins:
    get:
      operationId: admin-plugins
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.pluginAdminResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.errorBody'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/api.errorBody'
      summary: List every loaded plugin with its config and health
      tags:
      - admin
  /admin/plugins/{plugin_id}/logs:
    get:
      operationId: admin-plugin-logs
      parameters:
      - description: plugin id
        in: path
        name: plugin_id
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.pluginLogsResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.errorBody'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.errorBody'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/api.errorBody'
      summary: Serve a plugin's captured last logs
      tags:
      - admin
  /admin/sources:
    get:
      operationId: admin-sources
      parameters:
      - description: compute per-plugin title counts from the stored documents (O(all-rows))
        in: query
        name: title_counts
        type: boolean
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.sourceAdminResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.errorBody'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.errorBody'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/api.errorBody'
      summary: List every loaded metadata-source plugin with its gates
      tags:
      - admin
  /admin/sources/{plugin_id}:
    patch:
      operationId: admin-source-patch
      parameters:
      - description: plugin id
        in: path
        name: plugin_id
        required: true
        type: string
      - description: gate to write
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.sourcePatchRequest'
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.sourcePatchResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.errorBody'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.errorBody'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/api.errorBody'
      summary: Enable or disable a metadata source module-wide
      tags:
      - admin
  /admin/sources/{plugin_id}/search:
    get:
      operationId: source-search

        "400":
          description: malformed body or non-integer device id
          schema:
            $ref: '#/definitions/api.errorBody'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.errorBody'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.errorBody'
        "404":
          description: unknown device id or unknown user
          schema:
            $ref: '#/definitions/api.errorBody'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.errorBody'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/api.errorBody'
      summary: Bind a device to a user (null unbinds)
      tags:
      - admin
  /admin/groups:
    get:

      relative_path:
        type: string
      schema_version:
        type: integer
      status:
        type: string
      title_override:
        type: string
      watched:
        description: |-
          Watched (watched-states D1): true only when EVERY backing episode is
          ledgered — the all-episodes law the scoreSeries walk derives; zero
          episodes never watched.
        type: boolean

      tags:
      - admin
  /admin/devices/{id}/user:
    put:
      operationId: admin-devices-bind-user
      parameters:
      - description: device id (the credentials rowid the device list shows)
        in: path
        name: id
        required: true
        type: integer
      - description: '{user_id: number|null}'
        in: body
        name: body
        required: true
        schema:
          type: object
      responses:
        "204":

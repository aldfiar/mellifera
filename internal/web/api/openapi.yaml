        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.errorBody'
        "404":
          description: unknown group id
          schema:
            $ref: '#/definitions/api.errorBody'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.errorBody'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/api.errorBody'
      summary: Get a group
      tags:
      - admin
    patch:
      operationId: admin-groups-rename
      parameters:
      - description: group id
        in: path
        name: id
        required: true

host: localhost:8080
info:
  contact: {}
  description: 'Mellifera HTTP edge: scan-root (library) management, item browse/detail,
    and admin liveness. Every handler is pure delegation (parse -> one domain call
    -> write).'
  license:
    name: Apache-2.0
  title: Mellifera API
  version: "1.0"
paths:
  /admin/devices:
    get:
      operationId: admin-devices
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.devicesResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.errorBody'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/api.errorBody'

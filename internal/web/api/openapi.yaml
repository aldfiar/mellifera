        required: true
        type: integer
      - description: '{debug: bool}'
        in: body
        name: body
        required: true
        schema:
          type: object
      responses:
        "200":
          description: flag written (the device's next /profile answer and the registry
            list carry the new state)
        "400":
          description: malformed body or non-integer device id
          schema:
            $ref: '#/definitions/api.errorBody'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.errorBody'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.errorBody'
        "404":
          description: unknown device id
          schema:
            $ref: '#/definitions/api.errorBody'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.errorBody'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/api.errorBody'

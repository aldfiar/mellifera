basePath: /api/v1
definitions:
  api.EnrichPreview:
    properties:
      cooling:
        type: integer
      matches:
        type: integer
      pending:
        type: integer
      plugin_id:
        type: string
      versions:
        additionalProperties:
          type: integer
        type: object
    type: object
  api.EnrichStats:
    properties:
      done:
        type: integer
      failed:
        type: integer
      in_flight:
        type: integer
      pending:
        type: integer
    type: object
  api.ModulePresentation:
    properties:
      identity_fields:
        items:
          type: string
        type: array
      item_name:
        description: |-
          ItemName is the module's default display.item_name element template
          (display-naming 3.2/3.3): the composition floor under the library's
          own naming_element_name option — namerFor uses the library option when
          set, else this default, else no composition.
        type: string
      parsers:
        items:
          $ref: '#/definitions/api.ParserBinding'
        type: array
    type: object
  api.ParserBinding:
    properties:
      capability:
        type: string
      display_fields:
        items:
          type: string
        type: array
      id:
        type: string
    type: object
  api.PluginHealth:
    properties:
      checked_at:
        type: string
      id:
        type: string
      restarts:
        type: integer
      state:
        type: string
    type: object
  api.ReenrichResult:
    properties:
      deferred:
        type: integer
      queued:
        type: integer
      stripped:
        type: integer
    type: object
  api.apiError:
    properties:
      code:
        type: string
      message:
        type: string
      retryable:
        type: boolean
    type: object
  api.createLibraryRequest:
    properties:
      description:
        type: string
      display_name:
        type: string
      module_id:
        type: string
      root_path:
        type: string
    type: object
  api.enrichFailureDTO:
    properties:
      attempts:
        type: integer
      failed_at:
        type: string
      next_eligible_at:
        type: string
      plugin_id:
        type: string
      reason:
        type: string
      row_id:
        type: string
      row_kind:
        type: string
      status:
        type: string
      title:
        type: string
    type: object
  api.enrichFailuresResponse:
    properties:
      failures:
        items:
          $ref: '#/definitions/api.enrichFailureDTO'
        type: array
    type: object
  api.errorBody:
    properties:
      error:
        $ref: '#/definitions/api.apiError'
    type: object
  api.folderDTO:
    properties:
      items:
        type: integer
      path:
        type: string
    type: object
  api.itemDTO:
    properties:
      display_name:
        type: string
      document:
        items:
          type: integer
        type: array
      extra_parsers:
        items:
          type: string
        type: array
      file_id:
        type: string
      id:
        type: string
      library_id:
        type: integer
      media_type:
        type: string
      module_id:
        type: string
      relative_path:
        type: string
      schema_version:
        type: integer
      status:
        type: string
      title_override:
        type: string
    type: object
  api.itemParsersRequest:
    properties:
      parsers:
        items:
          type: string
        type: array
    type: object
  api.itemParsersResponse:
    properties:
      parsers:
        items:
          type: string
        type: array
    type: object
  api.itemResponse:
    properties:
      item:
        $ref: '#/definitions/api.itemDTO'
    type: object
  api.itemsResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/api.itemDTO'
        type: array
    type: object
  api.librariesResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/api.libraryDTO'
        type: array
    type: object
  api.libraryDTO:
    properties:
      description:
        type: string
      display_name:
        type: string
      id:
        type: integer
      module:
        $ref: '#/definitions/api.ModulePresentation'
      module_id:
        type: string
      naming_element_name:
        type: string
      naming_group_style:
        type: string
      root_path:
        type: string
      streams_enabled:
        type: boolean
    type: object
  api.libraryFoldersResponse:
    properties:
      folders:
        items:
          $ref: '#/definitions/api.folderDTO'
        type: array
    type: object
  api.libraryRefreshRequest:
    properties:
      plugin_id:
        type: string
      row_ids:
        items:
          type: string
        type: array
    type: object
  api.librarySummaryResponse:
    properties:
      items:
        type: integer
      library_id:
        type: integer
      updated_at:
        type: string
    type: object
  api.playRequest:
    properties:
      from_seconds:
        type: number
      retry:
        type: boolean
    type: object
  api.playResponse:
    properties:
      queued:
        type: boolean
    type: object
  api.playbackResponse:
    properties:
      mode:
        type: string
      play_url:
        type: string
      sections:
        items:
          additionalProperties: {}
          type: object
        type: array
      state:
        type: string
      voiceovers:
        items:
          additionalProperties: {}
          type: object
        type: array
    type: object
  api.progressDTO:
    properties:
      item_id:
        type: string
      position_seconds:
        type: integer
      updated_at:
        type: string
    type: object
  api.progressListResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/api.progressDTO'
        type: array
    type: object
  api.progressRequest:
    properties:
      position_seconds:
        type: integer
    type: object
  api.scanResponse:
    properties:
      discovered:
        type: integer
      library_id:
        type: integer
      persisted:
        type: integer
      warnings:
        items:
          type: string
        type: array
    type: object
  api.seriesDTO:
    properties:
      display_name:
        type: string
      document:
        items:
          type: integer
        type: array
      id:
        type: string
      library_id:
        type: integer
      module_id:
        type: string
      relative_path:
        type: string
      schema_version:
        type: integer
      status:
        type: string
      title_override:
        type: string
    type: object
  api.seriesListResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/api.seriesDTO'
        type: array
    type: object
  api.seriesResponse:
    properties:
      series:
        $ref: '#/definitions/api.seriesDTO'
    type: object
  api.statusResponse:
    properties:
      enrich:
        $ref: '#/definitions/api.EnrichStats'
      plugins:
        items:
          $ref: '#/definitions/api.PluginHealth'
        type: array
    type: object
  api.titleOverrideDTO:
    properties:
      entity_id:
        type: string
      title:
        type: string
      updated_at:
        type: string
    type: object
  api.titleRequest:
    properties:
      title:
        type: string
    type: object
  api.updateLibraryRequest:
    properties:
      description:
        type: string
      display_name:
        type: string
      module_id:
        type: string
      naming_element_name:
        type: string
      naming_group_style:
        type: string
      parsers:
        items:
          type: string
        type: array
      root_path:
        type: string
      streams_enabled:
        type: boolean
    type: object
host: localhost:8080
info:
  contact: {}
  description: 'Mellifera HTTP edge: scan-root (library) management, item browse/detail,
    and admin liveness. Every handler is pure delegation (parse -> one domain call
    -> write).'
  license:
    name: Apache-2.0
  title: Mellifera API
  version: "1.0"
paths:
  /admin/status:
    get:
      operationId: admin-status
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.statusResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.errorBody'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/api.errorBody'
      summary: Admin liveness snapshot (plugins + enrich queue)
      tags:
      - admin
  /enrich/failures:
    get:
      operationId: enrich-failures
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.enrichFailuresResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.errorBody'
      summary: List the enrichment failure ledger
      tags:
      - admin
  /items:
    get:
      operationId: list-items
      parameters:
      - description: library id filter
        in: query
        name: library
        type: integer
      - description: status filter (empty = all)
        in: query
        name: status
        type: string
      - description: page size (default 50, max 200)
        in: query
        name: limit
        type: integer
      - description: page offset
        in: query
        name: offset
        type: integer
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.itemsResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.errorBody'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.errorBody'
      summary: List items (optionally filtered by library + status)
      tags:
      - items
  /items/{id}:
    get:
      operationId: get-item
      parameters:
      - description: item id (UUID)
        in: path
        name: id
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.itemResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.errorBody'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.errorBody'
      summary: Get a single item with its full document
      tags:
      - items
  /items/{id}/media:
    get:
      operationId: get-item-media
      parameters:
      - description: item id (UUID)
        in: path
        name: id
        required: true
        type: string
      - description: media variant (thumb, sidecar)
        in: query
        name: variant
        type: string
      - description: sidecar document index (variant=sidecar)
        in: query
        name: "n"
        type: integer
      responses:
        "200":
          description: OK
          schema:
            type: file
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.errorBody'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.errorBody'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.errorBody'
      summary: Serve an item's media bytes
      tags:
      - items
  /items/{id}/parsers:
    delete:
      operationId: delete-item-parsers
      parameters:
      - description: item id (UUID)
        in: path
        name: id
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.itemParsersResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.errorBody'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.errorBody'
      summary: Clear an item's element-only parser attachments
      tags:
      - items
    put:
      operationId: put-item-parsers
      parameters:
      - description: item id (UUID)
        in: path
        name: id
        required: true
        type: string
      - description: ordered parser ids (full replacement; empty clears)
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.itemParsersRequest'
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.itemParsersResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.errorBody'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.errorBody'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.errorBody'
      summary: Replace an item's element-only parser attachments
      tags:
      - items
  /items/{id}/play:
    post:
      operationId: item-play
      parameters:
      - description: item id
        in: path
        name: id
        required: true
        type: string
      - description: play options
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.playRequest'
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.playResponse'
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/api.playResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.errorBody'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.errorBody'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/api.errorBody'
      summary: Play one item (the only playback mutation)
      tags:
      - items
  /items/{id}/playback:
    get:
      operationId: item-playback
      parameters:
      - description: item id
        in: path
        name: id
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.playbackResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.errorBody'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/api.errorBody'
      summary: Playback descriptor for one item
      tags:
      - items
  /items/{id}/title:
    delete:
      operationId: delete-item-title
      parameters:
      - description: item id (itm_...)
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.errorBody'
      summary: Clear a manual display-title override
      tags:
      - items
    put:
      operationId: put-item-title
      parameters:
      - description: item id (itm_...)
        in: path
        name: id
        required: true
        type: string
      - description: the override title
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.titleRequest'
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.titleOverrideDTO'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.errorBody'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.errorBody'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.errorBody'
      summary: Set a manual display-title override
      tags:
      - items
  /libraries:
    get:
      operationId: list-libraries
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.librariesResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.errorBody'
      summary: List scan libraries
      tags:
      - libraries
    post:
      operationId: create-library
      parameters:
      - description: library to create
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.createLibraryRequest'
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/api.libraryDTO'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.errorBody'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.errorBody'
      summary: Create a scan library
      tags:
      - libraries
  /libraries/{id}:
    get:
      operationId: get-library
      parameters:
      - description: library id
        in: path
        name: id
        required: true
        type: integer
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.libraryDTO'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.errorBody'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.errorBody'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.errorBody'
      summary: Get a single library with its module presentation block
      tags:
      - libraries
    patch:
      operationId: update-library
      parameters:
      - description: library id
        in: path
        name: id
        required: true
        type: integer
      - description: fields to update
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.updateLibraryRequest'
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.libraryDTO'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.errorBody'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.errorBody'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.errorBody'
      summary: Update a library's display name, description, and/or parser chain
      tags:
      - libraries
  /libraries/{id}/enrich/preview:
    get:
      operationId: library-enrich-preview
      parameters:
      - description: library id
        in: path
        name: id
        required: true
        type: integer
      - description: plugin id
        in: query
        name: plugin_id
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.EnrichPreview'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.errorBody'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.errorBody'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.errorBody'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/api.errorBody'
      summary: Preview a plugin's re-enrichment drift for a library
      tags:
      - libraries
  /libraries/{id}/folders:
    get:
      operationId: library-folders
      parameters:
      - description: library id
        in: path
        name: id
        required: true
        type: integer
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.libraryFoldersResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.errorBody'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.errorBody'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.errorBody'
      summary: Depth-1 folder prefixes and item counts for a library
      tags:
      - libraries
  /libraries/{id}/refresh:
    post:
      operationId: library-refresh
      parameters:
      - description: library id
        in: path
        name: id
        required: true
        type: integer
      - description: plugin_id required; row_ids omitted = whole-library sweep
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.libraryRefreshRequest'
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/api.ReenrichResult'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.errorBody'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.errorBody'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/api.errorBody'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.errorBody'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/api.errorBody'
      summary: Kick off a plugin re-enrichment sweep for a library
      tags:
      - libraries
  /libraries/{id}/scan:
    post:
      operationId: scan-library
      parameters:
      - description: library id
        in: path
        name: id
        required: true
        type: integer
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.scanResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.errorBody'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.errorBody'
      summary: Trigger a scan for a library
      tags:
      - libraries
  /libraries/{id}/summary:
    get:
      operationId: library-summary
      parameters:
      - description: library id
        in: path
        name: id
        required: true
        type: integer
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.librarySummaryResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.errorBody'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.errorBody'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.errorBody'
      summary: Item count and last-update stamp for a library
      tags:
      - libraries
  /progress:
    get:
      operationId: list-progress
      parameters:
      - description: page size (default 20, max 100)
        in: query
        name: limit
        type: integer
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.progressListResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.errorBody'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.errorBody'
      summary: Recent playback positions (Continue rail)
      tags:
      - progress
  /progress/{item_id}:
    get:
      operationId: get-progress
      parameters:
      - description: item id (UUID)
        in: path
        name: item_id
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.progressDTO'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.errorBody'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.errorBody'
      summary: Get one item's stored playback position
      tags:
      - progress
    put:
      operationId: put-progress
      parameters:
      - description: item id (UUID)
        in: path
        name: item_id
        required: true
        type: string
      - description: position to store (seconds)
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.progressRequest'
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.progressDTO'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.errorBody'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.errorBody'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.errorBody'
      summary: Store the playback position for an item
      tags:
      - progress
  /series:
    get:
      operationId: list-series
      parameters:
      - description: library id filter
        in: query
        name: library
        required: true
        type: integer
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.seriesListResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.errorBody'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.errorBody'
      summary: List a library's series
      tags:
      - series
  /series/{id}:
    get:

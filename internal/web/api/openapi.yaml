basePath: /api/v1
definitions:
  api.EnrichStats:
    properties:
      done:
        type: integer
      failed:
        type: integer
      in_flight:
        type: integer
      pending:
        type: integer
    type: object
  api.PluginHealth:
    properties:
      checked_at:
        type: string
      id:
        type: string
      restarts:
        type: integer
      state:
        type: string
    type: object
  api.apiError:
    properties:
      code:
        type: string
      message:
        type: string
      retryable:
        type: boolean
    type: object
  api.createLibraryRequest:
    properties:
      description:
        type: string
      display_name:
        type: string
      module_id:
        type: string
      root_path:
        type: string
    type: object
  api.errorBody:
    properties:
      error:
        $ref: '#/definitions/api.apiError'
    type: object
  api.folderDTO:
    properties:
      items:
        type: integer
      path:
        type: string
    type: object
  api.itemDTO:
    properties:
      document:
        items:
          type: integer
        type: array
      file_id:
        type: string
      id:
        type: string
      library_id:
        type: integer
      media_type:
        type: string
      module_id:
        type: string
      relative_path:
        type: string
      schema_version:
        type: integer
      status:
        type: string
    type: object
  api.itemResponse:
    properties:
      item:
        $ref: '#/definitions/api.itemDTO'
    type: object
  api.itemsResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/api.itemDTO'
        type: array
    type: object
  api.librariesResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/api.libraryDTO'
        type: array
    type: object
  api.libraryDTO:
    properties:
      description:
        type: string
      display_name:
        type: string
      id:
        type: integer
      module_id:
        type: string
      root_path:
        type: string
    type: object
  api.libraryFoldersResponse:
    properties:
      folders:
        items:
          $ref: '#/definitions/api.folderDTO'
        type: array
    type: object
  api.librarySummaryResponse:
    properties:
      items:
        type: integer
      library_id:
        type: integer
      updated_at:
        type: string
    type: object
  api.progressDTO:
    properties:
      item_id:
        type: string
      position_seconds:
        type: integer
      updated_at:
        type: string
    type: object
  api.progressListResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/api.progressDTO'
        type: array
    type: object
  api.progressRequest:
    properties:
      position_seconds:
        type: integer
    type: object
  api.scanResponse:
    properties:
      discovered:
        type: integer
      library_id:
        type: integer
      persisted:
        type: integer
      warnings:
        items:
          type: string
        type: array
    type: object
  api.seriesDTO:
    properties:
      document:
        items:
          type: integer
        type: array
      id:
        type: string
      library_id:
        type: integer
      module_id:
        type: string
      relative_path:
        type: string
      schema_version:
        type: integer
      status:
        type: string
    type: object
  api.seriesListResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/api.seriesDTO'
        type: array
    type: object
  api.seriesResponse:
    properties:
      series:
        $ref: '#/definitions/api.seriesDTO'
    type: object
  api.statusResponse:
    properties:
      enrich:
        $ref: '#/definitions/api.EnrichStats'
      plugins:
        items:
          $ref: '#/definitions/api.PluginHealth'
        type: array
    type: object
  api.updateLibraryRequest:
    properties:
      description:
        type: string
      display_name:
        type: string
      module_id:
        type: string
      root_path:
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: 'Mellifera HTTP edge: scan-root (library) management, item browse/detail,
    and admin liveness. Every handler is pure delegation (parse -> one domain call
    -> write).'
  license:
    name: Apache-2.0
  title: Mellifera API
  version: "1.0"
paths:
  /admin/status:
    get:
      operationId: admin-status
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.statusResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.errorBody'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/api.errorBody'
      summary: Admin liveness snapshot (plugins + enrich queue)
      tags:
      - admin
  /items:
    get:
      operationId: list-items
      parameters:
      - description: library id filter
        in: query
        name: library
        type: integer
      - description: status filter (empty = all)
        in: query
        name: status
        type: string
      - description: page size (default 50, max 200)
        in: query
        name: limit
        type: integer
      - description: page offset
        in: query
        name: offset
        type: integer
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.itemsResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.errorBody'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.errorBody'
      summary: List items (optionally filtered by library + status)
      tags:
      - items
  /items/{id}:
    get:
      operationId: get-item
      parameters:
      - description: item id (UUID)
        in: path
        name: id
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.itemResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.errorBody'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.errorBody'
      summary: Get a single item with its full document
      tags:
      - items
  /libraries:
    get:
      operationId: list-libraries
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.librariesResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.errorBody'
      summary: List scan libraries
      tags:
      - libraries
    post:
      operationId: create-library
      parameters:
      - description: library to create
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.createLibraryRequest'
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/api.libraryDTO'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.errorBody'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.errorBody'
      summary: Create a scan library
      tags:
      - libraries
  /libraries/{id}:
    patch:
      operationId: update-library
      parameters:
      - description: library id
        in: path
        name: id
        required: true
        type: integer
      - description: fields to update
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.updateLibraryRequest'
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.libraryDTO'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.errorBody'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.errorBody'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.errorBody'
      summary: Update a library's display name and/or description
      tags:
      - libraries
  /libraries/{id}/folders:
    get:
      operationId: library-folders
      parameters:
      - description: library id
        in: path
        name: id
        required: true
        type: integer
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.libraryFoldersResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.errorBody'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.errorBody'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.errorBody'
      summary: Depth-1 folder prefixes and item counts for a library
      tags:
      - libraries
  /libraries/{id}/scan:
    post:
      operationId: scan-library
      parameters:
      - description: library id
        in: path
        name: id
        required: true
        type: integer
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.scanResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.errorBody'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.errorBody'
      summary: Trigger a scan for a library
      tags:
      - libraries
  /libraries/{id}/summary:
    get:
      operationId: library-summary
      parameters:
      - description: library id
        in: path
        name: id
        required: true
        type: integer
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.librarySummaryResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.errorBody'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.errorBody'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.errorBody'
      summary: Item count and last-update stamp for a library
      tags:
      - libraries
  /progress:
    get:
      operationId: list-progress
      parameters:
      - description: page size (default 20, max 100)
        in: query
        name: limit
        type: integer
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.progressListResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.errorBody'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.errorBody'
      summary: Recent playback positions (Continue rail)
      tags:
      - progress
  /progress/{item_id}:
    get:
      operationId: get-progress
      parameters:
      - description: item id (UUID)
        in: path
        name: item_id
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.progressDTO'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.errorBody'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.errorBody'
      summary: Get one item's stored playback position
      tags:
      - progress
    put:
      operationId: put-progress
      parameters:
      - description: item id (UUID)
        in: path
        name: item_id
        required: true
        type: string
      - description: position to store (seconds)
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.progressRequest'
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.progressDTO'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.errorBody'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.errorBody'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.errorBody'
      summary: Store the playback position for an item
      tags:
      - progress
  /series:
    get:
      operationId: list-series
      parameters:
      - description: library id filter
        in: query
        name: library
        required: true
        type: integer
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.seriesListResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.errorBody'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.errorBody'
      summary: List a library's series
      tags:
      - series
  /series/{id}:
    get:
      operationId: get-series
      parameters:
      - description: series id (ser_...)
        in: path
        name: id
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.seriesResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.errorBody'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.errorBody'
      summary: Get a single series with its full serial-level document
      tags:
      - series
  /series/{id}/episodes:
    get:
      operationId: list-series-episodes
      parameters:
      - description: series id (ser_...)
        in: path
        name: id
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.itemsResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.errorBody'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.errorBody'
      summary: List a series' episode items
      tags:
      - series
swagger: "2.0"

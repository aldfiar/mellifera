basePath: /api/v1
definitions:
  api.EnrichPreview:
    properties:
      cooling:
        type: integer
      matches:
        type: integer
      pending:
        type: integer
      plugin_id:
        type: string
      versions:
        additionalProperties:
          type: integer
        type: object
    type: object
  api.EnrichStats:
    properties:
      done:
        type: integer
      failed:
        type: integer
      in_flight:
        type: integer
      pending:
        type: integer
    type: object
  api.ModulePresentation:
    properties:
      identity_fields:
        items:
          type: string
        type: array
      item_name:
        description: |-
          ItemName is the module's default display.item_name element template
          (display-naming 3.2/3.3): the composition floor under the library's
          own naming_element_name option — namerFor uses the library option when
          set, else this default, else no composition.
        type: string
      language_preference:
        description: |-
          LanguagePreference is the module's display.language_preference order —
          the pick order the composer applies over object-shaped source titles.
        items:
          type: string
        type: array
      parsers:
        items:
          $ref: '#/definitions/api.ParserBinding'
        type: array
      refresh_sources:
        description: |-
          RefreshSources is the module's refreshable-source list (plugin-admin-
          surfaces, additive): the title_source_priority entries that carry a
          modeled metadata-source binding, whose plugin is loaded, and whose
          effective gate resolution is enabled, in config order — the refresh
          pickers' option list (chain parsers and scanners never appear). The
          display composition walk ignores the list — title behavior is
          byte-identical with and without it. Pairs are appended through
          AddRefreshSource, reusing the titleSourceBinding element type so the
          package-level export count stays at the complexity budget's cap of 12.
        items:
          $ref: '#/definitions/api.titleSourceBinding'
        type: array
      title_sources:
        description: |-
          TitleSources is the module's resolved title-walk input (plugin-title-
          enrichment D5, additive): display.title_source_priority in config order,
          each binding carrying its effective enabled flag AFTER gate resolution.
          The gate resolution lives upstream (cmd-side, via enrich.ResolveGates per
          library) — this shape is the pure seam-input; an empty/absent list means
          the composer skips the walk entirely. Pairs are appended through
          AddTitleSource — the element type is unexported (complexity budget:
          package-level exports capped at 12; see titleSourceBinding).
        items:
          $ref: '#/definitions/api.titleSourceBinding'
        type: array
    type: object
  api.ParserBinding:
    properties:
      capability:
        type: string
      display_fields:
        items:
          type: string
        type: array
      id:
        type: string
    type: object
  api.PluginHealth:
    properties:
      checked_at:
        type: string
      id:
        type: string
      message:
        description: |-
          Message is the plugin's own liveness word from the last status probe
          (plugin.Health.Message — the failure reason when not serving).
          ADDITIVE on both health surfaces (/admin/status and /admin/sources,
          plugin-title-enrichment): omitted on the wire while "".
        type: string
      restarts:
        type: integer
      state:
        type: string
    type: object
  api.ReenrichResult:
    properties:
      deferred:
        type: integer
      queued:
        type: integer
      stripped:
        type: integer
    type: object
  api.apiError:
    properties:
      code:
        type: string
      message:
        type: string
      retryable:
        type: boolean
    type: object
  api.createLibraryRequest:
    properties:
      description:
        type: string
      display_name:
        type: string
      module_id:
        type: string
      root_path:
        type: string
    type: object
  api.enrichFailureDTO:
    properties:
      attempts:
        type: integer
      failed_at:
        type: string
      next_eligible_at:
        type: string
      plugin_id:
        type: string
      reason:
        type: string
      row_id:
        type: string
      row_kind:
        type: string
      status:
        type: string
      title:
        type: string
    type: object
  api.enrichFailuresResponse:
    properties:
      failures:
        items:
          $ref: '#/definitions/api.enrichFailureDTO'
        type: array
    type: object
  api.errorBody:
    properties:
      error:
        $ref: '#/definitions/api.apiError'
    type: object
  api.folderDTO:
    properties:
      items:
        type: integer
      path:
        type: string
    type: object
  api.itemDTO:
    properties:
      display_name:
        type: string
      document:
        items:
          type: integer
        type: array
      extra_parsers:
        items:
          type: string
        type: array
      file_id:
        type: string
      id:
        type: string
      library_id:
        type: integer
      media_type:
        type: string
      module_id:
        type: string
      relative_path:
        type: string
      schema_version:
        type: integer
      status:
        type: string
      title_override:
        type: string
    type: object
  api.itemParsersRequest:
    properties:
      parsers:
        items:
          type: string
        type: array
    type: object
  api.itemParsersResponse:
    properties:
      parsers:
        items:
          type: string
        type: array
    type: object
  api.itemResponse:
    properties:
      item:
        $ref: '#/definitions/api.itemDTO'
    type: object
  api.itemsResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/api.itemDTO'
        type: array
    type: object
  api.librariesResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/api.libraryDTO'
        type: array
    type: object
  api.libraryDTO:
    properties:
      description:
        type: string
      display_name:
        type: string
      id:
        type: integer
      module:
        $ref: '#/definitions/api.ModulePresentation'
      module_id:
        type: string
      naming_element_name:
        type: string
      naming_group_style:
        type: string
      root_path:
        type: string
      streams_enabled:
        type: boolean
    type: object
  api.libraryFoldersResponse:
    properties:
      folders:
        items:
          $ref: '#/definitions/api.folderDTO'
        type: array
    type: object
  api.libraryRefreshRequest:
    properties:
      plugin_id:
        type: string
      row_ids:
        items:
          type: string
        type: array
    type: object
  api.librarySummaryResponse:
    properties:
      items:
        type: integer
      library_id:
        type: integer
      updated_at:
        type: string
    type: object
  api.playRequest:
    properties:
      from_seconds:
        type: number
      retry:
        type: boolean
    type: object
  api.playResponse:
    properties:
      queued:
        type: boolean
    type: object
  api.playbackResponse:
    properties:
      mode:
        type: string
      play_url:
        type: string
      sections:
        items:
          additionalProperties: {}
          type: object
        type: array
      state:
        type: string
      voiceovers:
        items:
          additionalProperties: {}
          type: object
        type: array
    type: object
  api.pluginAdminBinding:
    properties:
      auth_mode:
        type: string
      display_fields:
        items:
          type: integer
        type: array
      enabled:
        type: boolean
      kind:
        type: string
      module_id:
        type: string
      options:
        items:
          type: integer
        type: array
      priority:
        type: integer
    type: object
  api.pluginAdminEffective:
    properties:
      modules:
        additionalProperties:
          type: boolean
        type: object
    type: object
  api.pluginAdminPlugin:
    properties:
      capabilities:
        items:
          type: string
        type: array
      config:
        items:
          $ref: '#/definitions/api.pluginAdminBinding'
        type: array
      description:
        type: string
      effective:
        $ref: '#/definitions/api.pluginAdminEffective'
      health:
        $ref: '#/definitions/api.PluginHealth'
      name:
        type: string
      plugin_id:
        type: string
    type: object
  api.pluginAdminResponse:
    properties:
      plugins:
        items:
          $ref: '#/definitions/api.pluginAdminPlugin'
        type: array
    type: object
  api.pluginLogsResponse:
    properties:
      lines:
        items:
          type: string
        type: array
      plugin_id:
        type: string
    type: object
  api.progressDTO:
    properties:
      item_id:
        type: string
      position_seconds:
        type: integer
      updated_at:
        type: string
    type: object
  api.progressListResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/api.progressDTO'
        type: array
    type: object
  api.progressRequest:
    properties:
      position_seconds:
        type: integer
    type: object
  api.scanResponse:
    properties:
      discovered:
        type: integer
      library_id:
        type: integer
      persisted:
        type: integer
      warnings:
        items:
          type: string
        type: array
    type: object
  api.seriesDTO:
    properties:
      display_name:
        type: string
      document:
        items:
          type: integer
        type: array
      id:
        type: string
      library_id:
        type: integer
      module_id:
        type: string
      relative_path:
        type: string
      schema_version:
        type: integer
      status:
        type: string
      title_override:
        type: string
    type: object
  api.seriesListResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/api.seriesDTO'
        type: array
    type: object
  api.seriesResponse:
    properties:
      series:
        $ref: '#/definitions/api.seriesDTO'
    type: object
  api.sourceAdminChain:
    properties:
      module_id:
        type: string
      position:
        type: integer
    type: object
  api.sourceAdminEffective:
    properties:
      libraries:
        additionalProperties:
          type: boolean
        type: object
      modules:
        additionalProperties:
          type: boolean
        type: object
    type: object
  api.sourceAdminResponse:
    properties:
      sources:
        items:
          $ref: '#/definitions/api.sourceAdminSource'
        type: array
    type: object
  api.sourceAdminSource:
    properties:
      capabilities:
        items:
          type: string
        type: array
      chains:
        items:
          $ref: '#/definitions/api.sourceAdminChain'
        type: array
      description:
        type: string
      effective:
        $ref: '#/definitions/api.sourceAdminEffective'
      health:
        $ref: '#/definitions/api.PluginHealth'
      name:
        type: string
      plugin_id:
        type: string
      title_counts:
        $ref: '#/definitions/api.sourceTitleCounts'
    type: object
  api.sourcePatchRequest:
    properties:
      enabled:
        type: boolean
    type: object
  api.sourcePatchResponse:
    properties:
      queued:
        type: integer
    type: object
  api.sourcePreviewRequest:
    properties:
      gates:
        additionalProperties:
          type: boolean
        type: object
      library_id:
        type: integer
    type: object
  api.sourcePreviewResponse:
    properties:
      after:
        items:
          $ref: '#/definitions/api.sourcePreviewRow'
        type: array
      before:
        items:
          $ref: '#/definitions/api.sourcePreviewRow'
        type: array
    type: object
  api.sourcePreviewRow:
    properties:
      item_id:
        type: string
      name:
        type: string
      no_data:
        type: boolean
    type: object
  api.sourceTitleCounts:
    properties:
      items:
        type: integer
      series:
        type: integer
    type: object
  api.statusResponse:
    properties:
      enrich:
        $ref: '#/definitions/api.EnrichStats'
      plugins:
        items:
          $ref: '#/definitions/api.PluginHealth'
        type: array
    type: object
  api.titleOverrideDTO:
    properties:
      entity_id:
        type: string
      title:
        type: string
      updated_at:
        type: string
    type: object
  api.titleRequest:
    properties:
      title:
        type: string
    type: object
  api.titleSourceBinding:
    properties:
      enabled:
        type: boolean
      id:
        type: string
    type: object
  api.updateLibraryRequest:
    properties:
      description:
        type: string
      display_name:
        type: string
      module_id:
        type: string
      naming_element_name:
        type: string
      naming_group_style:
        type: string
      parsers:
        items:
          type: string
        type: array
      root_path:
        type: string
      streams_enabled:
        type: boolean
    type: object
host: localhost:8080
info:
  contact: {}
  description: 'Mellifera HTTP edge: scan-root (library) management, item browse/detail,
    and admin liveness. Every handler is pure delegation (parse -> one domain call
    -> write).'
  license:
    name: Apache-2.0
  title: Mellifera API
  version: "1.0"
paths:
  /admin/plugins:
    get:
      operationId: admin-plugins
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.pluginAdminResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.errorBody'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/api.errorBody'
      summary: List every loaded plugin with its config and health
      tags:
      - admin
  /admin/plugins/{plugin_id}/logs:
    get:
      operationId: admin-plugin-logs
      parameters:
      - description: plugin id
        in: path
        name: plugin_id
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.pluginLogsResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.errorBody'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.errorBody'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/api.errorBody'
      summary: Serve a plugin's captured last logs
      tags:
      - admin
  /admin/sources:
    get:
      operationId: admin-sources
      parameters:
      - description: compute per-plugin title counts from the stored documents (O(all-rows))
        in: query
        name: title_counts
        type: boolean
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.sourceAdminResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.errorBody'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.errorBody'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/api.errorBody'
      summary: List every loaded metadata-source plugin with its gates
      tags:
      - admin
  /admin/sources/{plugin_id}:
    patch:
      operationId: admin-source-patch
      parameters:
      - description: plugin id
        in: path
        name: plugin_id
        required: true
        type: string
      - description: gate to write
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.sourcePatchRequest'
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.sourcePatchResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.errorBody'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.errorBody'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/api.errorBody'
      summary: Enable or disable a metadata source module-wide
      tags:
      - admin
  /admin/sources/preview:
    post:
      operationId: admin-source-preview
      parameters:
      - description: library and hypothetical gates
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.sourcePreviewRequest'
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.sourcePreviewResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.errorBody'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.errorBody'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.errorBody'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/api.errorBody'
      summary: Preview composition under a hypothetical gate vector
      tags:
      - admin
  /admin/status:
    get:
      operationId: admin-status
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.statusResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.errorBody'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/api.errorBody'
      summary: Admin liveness snapshot (plugins + enrich queue)
      tags:
      - admin
  /enrich/failures:
    get:
      operationId: enrich-failures
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.enrichFailuresResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.errorBody'
      summary: List the enrichment failure ledger
      tags:
      - admin
  /items:
    get:
      operationId: list-items
      parameters:
      - description: library id filter
        in: query
        name: library
        type: integer
      - description: status filter (empty = all)
        in: query
        name: status
        type: string
      - description: page size (default 50, max 200)
        in: query
        name: limit
        type: integer
      - description: page offset
        in: query
        name: offset
        type: integer
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.itemsResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.errorBody'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.errorBody'
      summary: List items (optionally filtered by library + status)
      tags:
      - items
  /items/{id}:
    get:
      operationId: get-item
      parameters:
      - description: item id (UUID)
        in: path
        name: id
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.itemResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.errorBody'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.errorBody'
      summary: Get a single item with its full document
      tags:
      - items
  /items/{id}/media:
    get:
      operationId: get-item-media
      parameters:
      - description: item id (UUID)
        in: path
        name: id
        required: true
        type: string
      - description: media variant (thumb, sidecar)
        in: query
        name: variant
        type: string
      - description: sidecar document index (variant=sidecar)
        in: query
        name: "n"
        type: integer
      responses:
        "200":
          description: OK
          schema:
            type: file
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.errorBody'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.errorBody'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.errorBody'
      summary: Serve an item's media bytes
      tags:
      - items
  /items/{id}/parsers:
    delete:
      operationId: delete-item-parsers
      parameters:
      - description: item id (UUID)
        in: path
        name: id
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.itemParsersResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.errorBody'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.errorBody'
      summary: Clear an item's element-only parser attachments
      tags:
      - items
    put:
      operationId: put-item-parsers
      parameters:
      - description: item id (UUID)
        in: path
        name: id
        required: true
        type: string
      - description: ordered parser ids (full replacement; empty clears)
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.itemParsersRequest'
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.itemParsersResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.errorBody'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.errorBody'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.errorBody'
      summary: Replace an item's element-only parser attachments
      tags:
      - items
  /items/{id}/play:
    post:
      operationId: item-play
      parameters:
      - description: item id
        in: path
        name: id
        required: true
        type: string
      - description: play options
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.playRequest'
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.playResponse'
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/api.playResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.errorBody'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.errorBody'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/api.errorBody'
      summary: Play one item (the only playback mutation)
      tags:
      - items
  /items/{id}/playback:
    get:
      operationId: item-playback
      parameters:
      - description: item id
        in: path
        name: id
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.playbackResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.errorBody'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/api.errorBody'
      summary: Playback descriptor for one item
      tags:
      - items
  /items/{id}/title:
    delete:
      operationId: delete-item-title
      parameters:
      - description: item id (itm_...)
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.errorBody'
      summary: Clear a manual display-title override
      tags:
      - items
    put:
      operationId: put-item-title
      parameters:
      - description: item id (itm_...)
        in: path
        name: id
        required: true
        type: string
      - description: the override title
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.titleRequest'
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.titleOverrideDTO'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.errorBody'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.errorBody'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.errorBody'
      summary: Set a manual display-title override
      tags:
      - items
  /libraries:
    get:
      operationId: list-libraries
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.librariesResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.errorBody'
      summary: List scan libraries
      tags:
      - libraries
    post:
      operationId: create-library
      parameters:
      - description: library to create
        in: body
